<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a0a" />
    <meta name="description" content="随机生成重心 CORENESS 小红书文案与配图，支持一键复制和换一组。" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230b0a0a'/%3E%3Crect x='10' y='12' width='44' height='8' fill='white'/%3E%3Cpath d='M38 31h16v8H38v8H27V24h11z' fill='white'/%3E%3C/svg%3E" />
    <title>重心 CORENESS｜小红书发布助手</title>
    <link rel="stylesheet" href="./css/styles.css?v=20261003-1748" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero" aria-label="重心 CORENESS">
        <div class="masthead-meta" aria-hidden="true">
          <span>NATURAL&nbsp;&nbsp;STONE</span>
          <span>ALL TESTED</span>
        </div>
        <div class="logo-stage">
          <img class="brand-logo" src="./images/coreness-logo.png" alt="重心 CORENESS" />
        </div>
      </header>

      <main>
        <section class="generator-card" aria-label="小红书发布素材">
          <div class="copy-card">
            <div class="quote-mark" aria-hidden="true">“</div>
            <div id="copy-lines" class="copy-lines" aria-live="polite"></div>
            <button class="text-button" id="copy-button" type="button">
              <span aria-hidden="true">⧉</span>
              <span id="copy-button-text">复制整段文案</span>
            </button>
          </div>

          <div class="image-grid" id="image-grid" aria-label="本组小红书图片"></div>
          <button class="primary-button" id="refresh-button" type="button">
            <span id="refresh-button-text">换一组</span>
          </button>
        </section>
      </main>
    </div>

    <div class="image-viewer" id="image-viewer" role="dialog" aria-modal="true" aria-label="图片预览" hidden>
      <div class="image-viewer-toolbar">
        <p>轻点返回 · 长按保存</p>
        <button class="image-viewer-close" id="image-viewer-close" type="button" aria-label="关闭图片预览">关闭</button>
      </div>
      <div class="image-viewer-stage" id="image-viewer-stage">
        <img class="image-viewer-image" id="image-viewer-image" src="" alt="" />
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <script src="./js/coreness-copy.js?v=20261003-1748"></script>
    <script src="./js/config.js?v=20261003-1748"></script>
    <script src="./js/app.js?v=20261003-1802"></script>
  </body>
</html>
